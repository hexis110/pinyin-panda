<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinyin Panda</title>
<meta name="theme-color" content="#ff8a00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pinyin Panda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2b2b;--accent:#ff8a00;--good:#2e9e4f;--bad:#e0453a;--line:#f1d9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--card:#2a261d;--ink:#f6efe0;--accent:#ffa733;--good:#4cc76f;--bad:#ff6a5e;--line:#4a4130;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a14;--card:#2a261d;--ink:#f6efe0;--accent:#ffa733;--good:#4cc76f;--bad:#ff6a5e;--line:#4a4130;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
h1{margin:8px 0;font-size:2rem}
p{margin:8px 0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
.big{font-size:5rem;line-height:1.1}
.pic{font-size:3.2rem;line-height:1.2;min-height:1.2em}
.han{font-size:5.5rem;font-weight:700;line-height:1.15;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
button,select{font:inherit;color:var(--ink)}
button{cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px 28px;font-size:1.4rem;font-weight:700;width:100%;margin:8px 0}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px;font-size:2rem;font-weight:700}
.opt.good{background:var(--good);color:#fff;border-color:var(--good)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.top{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tones{display:flex;justify-content:space-around;font-size:2.2rem;font-weight:700}
.tones small{display:block;font-size:.8rem;font-weight:400}
.tip{font-size:.95rem;opacity:.8}
.speak{background:none;border:3px solid var(--line);border-radius:50%;width:54px;height:54px;font-size:1.6rem}
.msg{min-height:1.6em;font-size:1.2rem;font-weight:700;margin-top:10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}
.pick label{display:block;text-align:left;font-size:.85rem;opacity:.8;margin-bottom:4px}
select{width:100%;padding:10px;border-radius:12px;border:3px solid var(--line);background:var(--card);font-size:1.05rem}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <div id="start">
    <div class="big">🐼</div>
    <h1>Pinyin Panda</h1>
    <p>Look at the Chinese character. Pick the correct pinyin!</p>
    <div class="card">
      <div class="tones">
        <div>ā<small>1 flat</small></div><div>á<small>2 up</small></div><div>ǎ<small>3 dip</small></div><div>à<small>4 down</small></div>
      </div>
      <div class="tip">No mark = light tone (like ma in māma)</div>
    </div>
    <div class="pick">
      <div><label for="selTerm">Words from</label><select id="selTerm"></select></div>
      <div><label for="selLesson">Lesson</label><select id="selLesson"></select></div>
    </div>
    <p class="tip" id="poolInfo"></p>
    <button class="btn" id="go">Play!</button>
    <p id="best"></p>
  </div>

  <div id="play" class="hide">
    <div class="top"><span id="rd"></span><span id="sc"></span></div>
    <div class="bar"><i id="pg"></i></div>
    <div class="card">
      <div class="pic" id="pic"></div>
      <div class="han" id="han"></div>
      <button class="speak" id="spk" aria-label="Hear it">🔊</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="end" class="hide">
    <div class="big" id="medal"></div>
    <h1 id="final"></h1>
    <p id="endmsg"></p>
    <button class="btn" id="again">Play again</button>
    <button class="btn" id="menu" style="background:var(--card);color:var(--ink);border:3px solid var(--line)">Change words</button>
  </div>
</div>

function fillLessons(){
  var t=$("selTerm").value,s=$("selLesson");s.innerHTML="";
  var o=document.createElement("option");o.value="all";o.textContent="All lessons";s.appendChild(o);
  if(t==="all"){s.disabled=true;return}
  s.disabled=false;
  var seen={};DATA.forEach(function(d){if(d[4]===+t&&!seen[d[5]]){seen[d[5]]=1;
    var o=document.createElement("option");o.value=d[5];o.textContent="第"+d[5]+"课 (Lesson "+d[5]+")";s.appendChild(o)}});
}
function buildPool(){
  var t=$("selTerm").value,l=$("selLesson").value;
  pool=DATA.filter(function(d){return t==="all"||(d[4]===+t&&(l==="all"||d[5]===+l))});
  $("poolInfo").textContent=pool.length+" characters to practise";
  var key="pinyinPandaBest|"+t+"|"+(t==="all"?"all":l);
  var b=store(key);$("best").textContent=b?"⭐ Best score here: "+b+" / "+ROUNDS:"";
  store("pinyinPandaSel",t+"|"+l);
}
$("selTerm").onchange=function(){fillLessons();buildPool()};
$("selLesson").onchange=buildPool;

function speak(){
  try{var u=new SpeechSynthesisUtterance(cur[0]);u.lang="zh-CN";u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function start(){
  buildPool();
  items=shuffle(pool.slice()).slice(0,ROUNDS);round=0;score=0;
  $("start").classList.add("hide");$("end").classList.add("hide");$("play").classList.remove("hide");
  next();
}
function makeOptions(it){
  var right=mark(it[2]),valid={},seen={},opts=[right],base=it[2].slice(0,-1);
  valid[right]=1;seen[right]=1;
  it[3].forEach(function(r){valid[mark(r)]=1});
  function add(r){if(r&&!valid[r]&&!seen[r]){seen[r]=1;opts.push(r);return true}return false}
  // one wrong answer with the same letters but a different tone
  var tones=shuffle([1,2,3,4]);
  for(var k=0;k<4;k++){if(add(mark(base+tones[k])))break}
  // fill up with the pinyin of other characters
  for(var n=0;opts.length<3&&n<300;n++){add(mark(DATA[Math.floor(Math.random()*DATA.length)][2]))}
  var also=it[3].map(mark).filter(function(r){return r!==right});
  return{right:right,also:also,list:shuffle(opts)};
}
function next(){
  if(round>=items.length)return finish();
  cur=items[round];locked=false;
  $("rd").textContent="Question "+(round+1)+" / "+items.length;
  $("sc").textContent="⭐ "+score;
  $("pg").style.width=(round/items.length*100)+"%";
  $("pic").textContent=cur[1];$("han").textContent=cur[0];$("msg").textContent="";
  var o=makeOptions(cur),box=$("opts");box.innerHTML="";
  o.list.forEach(function(p){
    var b=document.createElement("button");b.className="opt";b.textContent=p;
    b.onclick=function(){pick(b,p===o.right,o)};box.appendChild(b);
  });
}
function pick(btn,ok,o){
  if(locked)return;locked=true;
  if(ok){btn.classList.add("good");score++;$("msg").textContent=["Great job! 🎉","Yes! 🌟","Super! 👏"][Math.floor(Math.random()*3)]}
  else{btn.classList.add("bad");
    $("msg").textContent="Almost! It’s "+o.right+(o.also.length?" (also "+o.also.join(", ")+")":"");
    Array.prototype.forEach.call($("opts").children,function(c){if(c.textContent===o.right)c.classList.add("good")})}
  $("sc").textContent="⭐ "+score;
  speak();round++;
  setTimeout(next,ok?1200:2600);
}
function finish(){
  var n=items.length;
  $("play").classList.add("hide");$("end").classList.remove("hide");
  var r=n?score/n:0;
  $("medal").textContent=r>=.9?"🏆":r>=.6?"🥈":"🐼";
  $("final").textContent=score+" / "+n;
  $("endmsg").textContent=r>=.9?"Amazing! You’re a pinyin star!":r>=.6?"Nice work! Try for a higher score!":"Good try! Practice makes perfect.";
  var t=$("selTerm").value,l=$("selLesson").value;
  var key="pinyinPandaBest|"+t+"|"+(t==="all"?"all":l);
  var b=parseInt(store(key)||"0",10);if(score>b)store(key,String(score));
}
$("go").onclick=start;
$("again").onclick=start;
$("menu").onclick=function(){$("end").classList.add("hide");$("start").classList.remove("hide");buildPool()};
$("spk").onclick=speak;

fillTerms();
var sel=(store("pinyinPandaSel")||"all|all").split("|");
$("selTerm").value=sel[0];if($("selTerm").value!==sel[0])$("selTerm").value="all";
fillLessons();
$("selLesson").value=sel[1];if($("selLesson").value!==sel[1])$("selLesson").value="all";
buildPool();

// make it installable and work offline
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
</script>
