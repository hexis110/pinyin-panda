<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinyin Panda</title>
<meta name="theme-color" content="#ff8a00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pinyin Panda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2b2b;--accent:#ff8a00;--good:#2e9e4f;--bad:#e0453a;--line:#f1d9a8;--soft:#fff0cf;--gold:#ffc83d;--grn:#b9e8a6;--yel:#ffe69a;--gry:#e7e2d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--card:#2a261d;--ink:#f6efe0;--accent:#ffa733;--good:#4cc76f;--bad:#ff6a5e;--line:#4a4130;--soft:#352f22;--gold:#c99a12;--grn:#35663a;--yel:#6b5a1c;--gry:#39342a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a14;--card:#2a261d;--ink:#f6efe0;--accent:#ffa733;--good:#4cc76f;--bad:#ff6a5e;--line:#4a4130;--soft:#352f22;--gold:#c99a12;--grn:#35663a;--yel:#6b5a1c;--gry:#39342a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
h1{margin:4px 0;font-size:1.8rem}
h2{margin:8px 0;font-size:1.3rem}
p{margin:6px 0}
.cjk{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;margin:10px 0}
button,select{font:inherit;color:var(--ink)}
button{cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-size:1.25rem;font-weight:700;width:100%;margin:6px 0}
.btn small{display:block;font-size:.85rem;font-weight:400;opacity:.95}
.btn.alt{background:#7a5cff}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row .btn{width:auto;flex:1;font-size:1rem;padding:10px 12px}
.tip{font-size:.9rem;opacity:.8}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.bar.xp i{background:#7a5cff}
.bar.goal i{background:var(--good)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left}
.avatar{font-size:3.2rem;grid-row:span 2}
.lvl{font-weight:700;font-size:1.15rem}
.chips{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem;margin-top:6px}
.chip{background:var(--soft);border-radius:12px;padding:6px 10px;flex:1}
.tones{display:flex;justify-content:space-around;font-size:1.8rem;font-weight:700}
.tones small{display:block;font-size:.7rem;font-weight:400}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}
.pick label{display:block;text-align:left;font-size:.8rem;opacity:.8;margin-bottom:3px}
select{width:100%;padding:9px;border-radius:12px;border:3px solid var(--line);background:var(--card);font-size:1rem}
.chipbtn{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;font-size:.95rem;margin:6px 0}
.chipbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chipbtn:disabled{opacity:.45}
.top{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:700}
.pic{font-size:3rem;line-height:1.2;min-height:1.2em}
.han{font-size:5.5rem;font-weight:700;line-height:1.15}
.pin{font-size:3.8rem;font-weight:700;line-height:1.3}
.speak{background:none;border:3px solid var(--line);border-radius:50%;width:52px;height:52px;font-size:1.5rem}
.opts{display:grid;gap:10px;margin-top:10px}
.opts.chars{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px 6px;font-size:1.9rem;font-weight:700}
.opts.chars .opt{font-size:3rem;padding:12px 4px}
.opt.good{background:var(--good);color:#fff;border-color:var(--good)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.combo{min-height:1.5em;font-weight:700;color:var(--accent);font-size:1.1rem}
.msg{min-height:1.6em;font-size:1.15rem;font-weight:700;margin-top:6px}
.stars{font-size:3.2rem;letter-spacing:6px}
.banner{background:linear-gradient(90deg,#7a5cff,#ff8a00);color:#fff;border-radius:16px;padding:10px;font-weight:700;margin:8px 0}
.mini{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mini .m{background:var(--soft);border-radius:14px;padding:6px 10px;font-size:1rem}
.mini .m b{font-size:1.5rem;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cell{border:2px solid var(--line);border-radius:12px;padding:8px 0;font-size:1.6rem;font-weight:700;background:var(--gry);position:relative}
.cell.s1{background:var(--yel)}.cell.s2{background:var(--grn)}.cell.s3{background:var(--gold)}
.cell.t::after{content:"🎯";font-size:.7rem;position:absolute;top:0;right:2px}
.cell.sel{outline:3px solid var(--accent)}
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:.8rem;margin:6px 0}
.legend span{padding:2px 8px;border-radius:10px;border:2px solid var(--line)}
.tabs{display:flex;gap:6px;justify-content:center;margin:8px 0}
.tabs button{flex:1;padding:8px 0;border-radius:12px;border:3px solid var(--line);background:var(--card);font-weight:700}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.detail .bigc{font-size:4rem;font-weight:700;line-height:1.1}
.trophies{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr{border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--card);text-align:center}
.tr .e{font-size:2.4rem}
.tr.locked{opacity:.45;filter:grayscale(1)}
.tr small{display:block;font-size:.78rem;opacity:.85}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:20;transition:transform .3s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.fxp{position:absolute;top:-10%;font-size:1.8rem;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.fxp{display:none}.bar i{transition:none}}
.hide{display:none}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <div id="home">
    <h1>🐼 Pinyin Panda</h1>
    <div class="card prof">
      <div class="avatar" id="avatar">🐼</div>
      <div class="lvl" id="lvl"></div>
      <div><div class="bar xp"><i id="xpbar"></i></div><div class="tip" id="xptxt"></div></div>
    </div>
    <div class="chips">
      <div class="chip" id="streak"></div>
      <div class="chip" id="goal"></div>
    </div>
    <div class="bar goal"><i id="goalbar"></i></div>

    <div class="pick">
      <div><label for="selTerm">Words from</label><select id="selTerm"></select></div>
      <div><label for="selLesson">Lesson</label><select id="selLesson"></select></div>
    </div>
    <button class="chipbtn" id="tricky"></button>
    <p class="tip" id="poolInfo"></p>

    <button class="btn" id="c1">🔤 Challenge 1: Read it<small>See the character, pick the pinyin</small></button>
    <div class="tip" id="b1"></div>
    <button class="btn alt" id="c2">👀 Challenge 2: Find it<small>See the pinyin, pick the character</small></button>
    <div class="tip" id="b2"></div>

    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="openColl">🗂️ My characters</button>
      <button class="btn ghost" id="openTrophy">🏆 Trophies</button>
      <button class="btn ghost" id="snd" aria-label="Sound">🔊</button>
    </div>
    <div class="card">
      <div class="tones">
        <div>ā<small>1 flat</small></div><div>á<small>2 up</small></div><div>ǎ<small>3 dip</small></div><div>à<small>4 down</small></div>
      </div>
      <div class="tip">No mark = light tone (like ma in māma)</div>
    </div>
  </div>

  <!-- PLAY -->
  <div id="play" class="hide">
    <div class="top"><span id="rd"></span><span id="sc"></span></div>
    <div class="bar"><i id="pg"></i></div>
    <div class="combo" id="combo"></div>
    <div class="card">
      <div class="pic" id="pic"></div>
      <div class="han cjk" id="han"></div>
      <div class="pin" id="pin"></div>
      <button class="speak" id="spk" aria-label="Hear it">🔊</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg"></div>
    <button class="chipbtn" id="quit" style="margin-top:14px">⬅ Stop</button>
  </div>

  <!-- END -->
  <div id="end" class="hide">
    <div class="stars" id="stars"></div>
    <h1 id="final"></h1>
    <p id="endmsg"></p>
    <div class="mini" id="xpline"></div>
    <div class="banner hide" id="lvlup"></div>
    <div id="newbadges"></div>
    <div class="card hide" id="missedBox"><h2>Words to practise</h2><div class="mini" id="missed"></div></div>
    <button class="btn" id="again">Play again</button>
    <button class="btn ghost" id="home2">Home</button>
  </div>

  <!-- COLLECTION -->
  <div id="coll" class="hide">
    <button class="chipbtn" id="back1">⬅ Back</button>
    <h2>🗂️ My characters</h2>
    <p class="tip" id="collSum"></p>
    <div class="legend"><span style="background:var(--gry)">New</span><span style="background:var(--yel)">Learning</span><span style="background:var(--grn)">Growing</span><span style="background:var(--gold)">Mastered</span><span>🎯 tricky</span></div>
    <div class="tabs" id="collTabs"></div>
    <div class="card detail hide" id="detail">
      <div class="bigc cjk" id="dChar"></div>
      <div class="pin" id="dPin" style="font-size:2.2rem"></div>
      <div class="tip" id="dInfo"></div>
      <button class="speak" id="dSpk" aria-label="Hear it">🔊</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- TROPHIES -->
  <div id="trophy" class="hide">
    <button class="chipbtn" id="back2">⬅ Back</button>
    <h2>🏆 Trophies</h2>
    <p class="tip" id="trSum"></p>
    <div class="trophies" id="trGrid"></div>
  </div>
</div>
<div id="fx"></div>
<div id="toast"></div>

var MK={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
function mark(r){
  var b=r.slice(0,-1),t=+r.slice(-1);
  if(!t)return b;
  var i=-1;
  if(b.indexOf("a")>-1)i=b.indexOf("a");
  else if(b.indexOf("e")>-1)i=b.indexOf("e");
  else if(b.indexOf("ou")>-1)i=b.indexOf("ou");
  else{for(var k=b.length-1;k>=0;k--){if("iouü".indexOf(b[k])>-1){i=k;break}}}
  return i<0?b:b.slice(0,i)+MK[b[i]][t-1]+b.slice(i+1);
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}

var SAVE_KEY="pinyinPandaSave2";
function defaults(){return{xp:0,correct:0,rounds:0,stats:{},badges:{},best:{},modes:{1:0,2:0},cleared:0,day:{last:"",streak:0},daily:{d:"",n:0,claimed:false},sound:true,sel:"all|all",tricky:false}}
function load(){var d=defaults();try{var raw=localStorage.getItem(SAVE_KEY);if(raw){var o=JSON.parse(raw);for(var k in o)d[k]=o[k]}}catch(e){}return d}
var S=load();

function dstr(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function today(){return dstr(new Date())}
function yesterday(){return dstr(new Date(Date.now()-864e5))}
function touchDay(){
  var t=today();
  if(S.daily.d!==t)S.daily={d:t,n:0,claimed:false};
  if(S.day.last===t)return;
  S.day.streak=(S.day.last===yesterday())?S.day.streak+1:1;
  S.day.last=t;
}
function liveStreak(){return(S.day.last===today()||S.day.last===yesterday())?S.day.streak:0}
function dailyN(){return S.daily.d===today()?S.daily.n:0}

// ---------- levels, mastery ----------
function levelInfo(xp){var L=1,need=100;while(xp>=need){xp-=need;L++;need=100*L}return{L:L,into:xp,need:need}}
function rankOf(L){return RANKS[Math.min(Math.floor((L-1)/2),RANKS.length-1)]}
function status(c){var e=S.stats[c];if(!e)return 0;var t=e[0]+e[1];return t>=6?3:t>=3?2:1}
function masteredCount(){var n=0;for(var c in S.stats)if(status(c)===3)n++;return n}
function trickyList(){return DATA.filter(function(d){var e=S.stats[d[0]];return e&&e[2]})}
function weight(d){var e=S.stats[d[0]];if(!e)return 2.5;return 1+(6-e[0]-e[1])*.4+(e[2]?3:0)}
function pickItems(pool,n){
  var arr=pool.slice(),out=[];
  while(out.length<n&&arr.length){
    var tot=0,i;for(i=0;i<arr.length;i++)tot+=weight(arr[i]);
    var r=Math.random()*tot;for(i=0;i<arr.length;i++){r-=weight(arr[i]);if(r<=0)break}
    if(i>=arr.length)i=arr.length-1;
    out.push(arr.splice(i,1)[0]);
  }
  return out;
}

 {id:"c500",e:"🚀",n:"Rocket",d:"500 right answers",ok:function(){return S.correct>=500}},
 {id:"d3",e:"📅",n:"3-Day Streak",d:"Play 3 days in a row",ok:function(){return S.day.streak>=3}},
 {id:"d7",e:"🗓️",n:"Week Warrior",d:"Play 7 days in a row",ok:function(){return S.day.streak>=7}},
 {id:"m10",e:"🌟",n:"Word Collector",d:"Master 10 characters",ok:function(){return masteredCount()>=10}},
 {id:"m50",e:"🏅",n:"Character Hero",d:"Master 50 characters",ok:function(){return masteredCount()>=50}},
 {id:"m200",e:"🏆",n:"Hanzi Legend",d:"Master 200 characters",ok:function(){return masteredCount()>=200}},
 {id:"l5",e:"⭐",n:"Level 5",d:"Reach level 5",ok:function(){return levelInfo(S.xp).L>=5}},
 {id:"l10",e:"👑",n:"Level 10",d:"Reach level 10",ok:function(){return levelInfo(S.xp).L>=10}}
];

// ---------- sound and effects ----------
var AC=null;
function ac(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=false}}return AC}
function tone(f,t,d,type,v){
  var a=ac();if(!a||!S.sound)return;
  try{var o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
    o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02)}catch(e){}
}
function sfx(k){
  if(k==="ok"){tone(660,0,.12);tone(880,.1,.18)}
  else if(k==="no"){tone(200,0,.28,"sawtooth",.07)}
  else if(k==="up"){[523,659,784,1047].forEach(function(f,i){tone(f,i*.12,.22)})}
}
function confetti(n){
  var fx=$("fx"),em=["🎉","⭐","✨","🎊","🐼"];
  for(var i=0;i<(n||24);i++){
    var p=h("span","fxp",em[i%em.length]);
    p.style.left=Math.random()*100+"%";p.style.animationDelay=Math.random()*.6+"s";
    fx.appendChild(p);
    (function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x)},2800)})(p);
  }
}
var toastT=null;
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},2200)}

// ---------- screens ----------
var SCREENS=["home","play","end","coll","trophy"];
function show(id){SCREENS.forEach(function(s){$(s).classList.toggle("hide",s!==id)});if(id==="home")renderHome();try{window.scrollTo(0,0)}catch(e){}}

// ---------- word picker ----------
function fillTerms(){
  var s=$("selTerm");clear(s);
  var o=h("option","","All words ("+DATA.length+")");o.value="all";s.appendChild(o);
  TERMS.forEach(function(t,i){var n=DATA.filter(function(d){return d[4]===i}).length;
    var o=h("option","",t+" ("+n+")");o.value=i;s.appendChild(o)});
}
function fillLessons(){
  var t=$("selTerm").value,s=$("selLesson");clear(s);
  var o=h("option","","All lessons");o.value="all";s.appendChild(o);
  if(t==="all"){s.disabled=true;return}
  s.disabled=false;
  var seen={};DATA.forEach(function(d){if(d[4]===+t&&!seen[d[5]]){seen[d[5]]=1;
    var o=h("option","","第"+d[5]+"课 (Lesson "+d[5]+")");o.value=d[5];s.appendChild(o)}});
}
function selection(){var t=$("selTerm").value,l=$("selLesson").value;return{t:t,l:t==="all"?"all":l}}
function poolNow(){
  if(S.tricky)return trickyList();
  var s=selection();
  return DATA.filter(function(d){return s.t==="all"||(d[4]===+s.t&&(s.l==="all"||d[5]===+s.l))});
}
function bestKey(m){var s=selection();return"m"+m+"|"+s.t+"|"+s.l}
function renderHome(){
  var L=levelInfo(S.xp),r=rankOf(L.L);
  $("avatar").textContent=r[0];
  $("lvl").textContent="Level "+L.L+" · "+r[1];
  $("xpbar").style.width=(L.into/L.need*100)+"%";
  $("xptxt").textContent=L.into+" / "+L.need+" XP to level "+(L.L+1);
  var st=liveStreak();
  $("streak").textContent=st?"🔥 "+st+"-day streak":"🔥 Start a streak!";
  var n=Math.min(dailyN(),DAILY_GOAL);
  $("goal").textContent=n>=DAILY_GOAL?"🎯 Daily goal done!":"🎯 Today "+n+" / "+DAILY_GOAL;
  $("goalbar").style.width=(n/DAILY_GOAL*100)+"%";
  var tl=trickyList().length;
  if(S.tricky&&!tl)S.tricky=false;
  $("tricky").textContent="🎯 Tricky words only ("+tl+")";
  $("tricky").disabled=!tl;
  $("tricky").classList.toggle("on",!!S.tricky);
  $("selTerm").disabled=!!S.tricky;$("selLesson").disabled=!!S.tricky||$("selTerm").value==="all";
  var p=poolNow();
  $("poolInfo").textContent=p.length+" characters to practise";
  var b1=S.best[bestKey(1)],b2=S.best[bestKey(2)];
  $("b1").textContent=S.tricky?"":(b1!=null?"⭐ Best here: "+b1+" / "+ROUNDS:"");
  $("b2").textContent=S.tricky?"":(b2!=null?"⭐ Best here: "+b2+" / "+ROUNDS:"");
  $("c1").disabled=$("c2").disabled=!p.length;
  $("snd").textContent=S.sound?"🔊":"🔇";
}
$("selTerm").onchange=function(){fillLessons();S.sel=$("selTerm").value+"|"+$("selLesson").value;save();renderHome()};
$("selLesson").onchange=function(){S.sel=$("selTerm").value+"|"+$("selLesson").value;save();renderHome()};
$("tricky").onclick=function(){S.tricky=!S.tricky;save();renderHome()};
$("snd").onclick=function(){S.sound=!S.sound;save();renderHome();sfx("ok")};

// ---------- round ----------
var M=1,round,score,cur,items,locked,streak,R,RPOOL=[],token=0;
function speak(c){
  try{var u=new SpeechSynthesisUtterance(c);u.lang="zh-CN";u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function startRound(mode){
  var pool=poolNow();if(!pool.length)return;
  M=mode;touchDay();token++;RPOOL=pool;
  items=pickItems(pool,Math.min(ROUNDS,pool.length));
  round=0;score=0;streak=0;
  R={xpStart:S.xp,levelStart:levelInfo(S.xp).L,maxStreak:0,missed:[],seen:{}};
  S.sel=$("selTerm").value+"|"+$("selLesson").value;save();
  show("play");next();
}
// Challenge 1: character -> choose pinyin
function makeOptions(it){
  var right=mark(it[2]),valid={},seen={},opts=[right],base=it[2].slice(0,-1);
  valid[right]=1;seen[right]=1;
  it[3].forEach(function(r){valid[mark(r)]=1});
  function add(r){if(r&&!valid[r]&&!seen[r]){seen[r]=1;opts.push(r);return true}return false}
  var tones=shuffle([1,2,3,4]);
  for(var k=0;k<4;k++){if(add(mark(base+tones[k])))break}
  for(var n=0;opts.length<3&&n<300;n++){add(mark(DATA[Math.floor(Math.random()*DATA.length)][2]))}
  var also=it[3].map(mark).filter(function(r){return r!==right});
  return{right:right,also:also,list:shuffle(opts)};
}
// Challenge 2: pinyin -> choose character
function makeCharOptions(it,cands){
  var shown=it[2],base=shown.slice(0,-1);
  function clash(d){return d===it||d[2]===shown||d[3].indexOf(shown)>-1}
  function usable(list){return list.filter(function(d){return !clash(d)})}
  var pool=usable(cands);
  if(pool.length<2)pool=usable(DATA);
  var opts=[it],used={};used[it[0]]=1;
  var same=pool.filter(function(d){return d[2].slice(0,-1)===base});
  if(same.length){var s=same[Math.floor(Math.random()*same.length)];opts.push(s);used[s[0]]=1}
  var rest=shuffle(pool.filter(function(d){return !used[d[0]]}));
  for(var i=0;opts.length<3&&i<rest.length;i++)opts.push(rest[i]);
  return{right:it[0],list:shuffle(opts),shown:mark(shown)};
}
function next(){
  if(round>=items.length)return finish();
  cur=items[round];locked=false;
  $("rd").textContent="Question "+(round+1)+" / "+items.length;
  $("sc").textContent="⭐ "+score;
  $("pg").style.width=(round/items.length*100)+"%";
  $("combo").textContent=streak>=2?"🔥 "+streak+" in a row!":"";
  $("msg").textContent="";
  var box=$("opts");clear(box);
  var o;
  if(M===1){
    $("pic").classList.remove("hide");$("han").classList.remove("hide");$("pin").classList.add("hide");
    $("pic").textContent=cur[1];$("han").textContent=cur[0];
    box.className="opts";
    o=makeOptions(cur);
    o.list.forEach(function(p){
      var b=h("button","opt",p);
      b.onclick=function(){answer(b,p===o.right,o)};box.appendChild(b);
    });
  }else{
    $("pic").classList.add("hide");$("han").classList.add("hide");$("pin").classList.remove("hide");
    $("pin").textContent=mark(cur[2]);
    box.className="opts chars";
    o=makeCharOptions(cur,RPOOL);
    o.list.forEach(function(d){
      var b=h("button","opt cjk",d[0]);
      b.onclick=function(){answer(b,d[0]===o.right,o)};box.appendChild(b);
    });
  }
}
function record(it,ok){
  var c=it[0],e=S.stats[c]||(S.stats[c]=[0,0,0]),i=M-1;
  if(ok){e[i]=Math.min(3,e[i]+1);if(e[2]){e[2]=0;S.cleared++}}
  else{e[i]=Math.max(0,e[i]-1);e[2]=1}
}
function answer(btn,ok,o){
  if(locked)return;locked=true;
  record(cur,ok);
  if(ok){
    btn.classList.add("good");score++;streak++;if(streak>R.maxStreak)R.maxStreak=streak;
    var gain=10+Math.min(streak-1,5)*2;
    S.xp+=gain;S.correct++;
    if(S.daily.d!==today())S.daily={d:today(),n:0,claimed:false};
    S.daily.n++;
    if(S.daily.n>=DAILY_GOAL&&!S.daily.claimed){S.daily.claimed=true;S.xp+=50;R.goalHit=true;toast("🎯 Daily goal reached! +50 XP");confetti(18)}
    $("msg").textContent=["Great job! 🎉","Yes! 🌟","Super! 👏","Well done! 💪"][Math.floor(Math.random()*4)]+"  +"+gain+" XP";
    sfx("ok");
  }else{
    btn.classList.add("bad");streak=0;
    if(!R.seen[cur[0]]){R.seen[cur[0]]=1;R.missed.push(cur)}
    if(M===1)$("msg").textContent="Almost! It’s "+o.right+(o.also.length?" (also "+o.also.join(", ")+")":"");
    else $("msg").textContent="Almost! "+o.shown+" is "+o.right;
    Array.prototype.forEach.call($("opts").children,function(c){if(c.textContent===o.right)c.classList.add("good")});
    sfx("no");
  }
  $("sc").textContent="⭐ "+score;
  $("combo").textContent=streak>=2?"🔥 "+streak+" in a row!":"";
  save();
  speak(cur[0]);round++;
  var t=token;
  setTimeout(function(){if(t===token)next()},ok?1200:2600);
}
function finish(){
  var n=items.length,ratio=n?score/n:0,stars=ratio>=1?3:ratio>=.8?2:ratio>=.5?1:0;
  var perfect=(n===ROUNDS&&score===n),bonus=Math.round(20*n/ROUNDS)+(perfect?30:0);
  S.xp+=bonus;S.rounds++;S.modes[M]=(S.modes[M]||0)+1;
  var s=selection(),single=!S.tricky&&s.t!=="all"&&s.l!=="all";
  if(!S.tricky){var k=bestKey(M);if(S.best[k]==null||score>S.best[k])S.best[k]=score}
  var ctx={perfect:perfect,maxStreak:R.maxStreak,single:single},newB=[];
  BADGES.forEach(function(b){if(!S.badges[b.id]&&b.ok(ctx)){S.badges[b.id]=today();newB.push(b)}});
  var L=levelInfo(S.xp).L,up=L>R.levelStart;
  save();
  show("end");
  $("stars").textContent="★★★".slice(0,stars)+"☆☆☆".slice(0,3-stars);
  $("final").textContent=score+" / "+n;
  $("endmsg").textContent=perfect?"Perfect! You’re a pinyin star!":ratio>=.8?"Amazing work!":ratio>=.5?"Nice work! Try for more stars!":"Good try! Practice makes perfect.";
  var line=$("xpline");clear(line);
  [["⭐","+"+(S.xp-R.xpStart)+" XP"],["🔥","Best combo "+R.maxStreak],["🌟","Mastered "+masteredCount()]].forEach(function(x){
    var m=h("div","m");m.appendChild(h("b","",x[0]));m.appendChild(document.createTextNode(x[1]));line.appendChild(m)});
  var lu=$("lvlup");
  if(up){lu.classList.remove("hide");var r=rankOf(L);lu.textContent="🎉 Level up! You are now Level "+L+" · "+r[0]+" "+r[1]}
  else lu.classList.add("hide");
  var nb=$("newbadges");clear(nb);
  newB.forEach(function(b){var c=h("div","banner","🏆 New trophy: "+b.e+" "+b.n+" – "+b.d);nb.appendChild(c)});
  var mb=$("missedBox"),ms=$("missed");clear(ms);
  if(R.missed.length){
    mb.classList.remove("hide");
    R.missed.forEach(function(d){var m=h("div","m");var b=h("b","cjk",d[0]);m.appendChild(b);m.appendChild(document.createTextNode(mark(d[2])));ms.appendChild(m)});
  }else mb.classList.add("hide");
  if(up||newB.length||stars===3){sfx("up");confetti(up?36:24)}
}
$("c1").onclick=function(){startRound(1)};
$("c2").onclick=function(){startRound(2)};
$("again").onclick=function(){startRound(M)};
$("home2").onclick=function(){show("home")};
$("quit").onclick=function(){token++;save();show("home")};
$("spk").onclick=function(){if(cur)speak(cur[0])};

// ---------- collection ----------
var collTerm=0,collSel=null;
function renderColl(){
  var tabs=$("collTabs");clear(tabs);
  TERMS.forEach(function(t,i){var b=h("button",i===collTerm?"on":"",t);b.onclick=function(){collTerm=i;collSel=null;renderColl()};tabs.appendChild(b)});
  var m=masteredCount(),seen=Object.keys(S.stats).length;
  $("collSum").textContent="Mastered "+m+" · Seen "+seen+" · Total "+DATA.length;
  var g=$("grid");clear(g);
  DATA.filter(function(d){return d[4]===collTerm}).forEach(function(d){
    var e=S.stats[d[0]];
    var b=h("button","cell cjk s"+status(d[0])+(e&&e[2]?" t":"")+(collSel===d[0]?" sel":""),d[0]);
    b.onclick=function(){collSel=d[0];renderColl()};g.appendChild(b);
  });
  var dt=$("detail");
  if(collSel){
    var it=DATA.filter(function(d){return d[0]===collSel})[0];
    dt.classList.remove("hide");
    $("dChar").textContent=it[0];
    $("dPin").textContent=[it[2]].concat(it[3]).map(mark).join(" / ");
    var s=["Not played yet","Learning","Growing","Mastered!"][status(it[0])];
    $("dInfo").textContent=(it[1]?it[1]+"  ":"")+TERMS[it[4]]+" 第"+it[5]+"课 · "+s;
    $("dSpk").onclick=function(){speak(it[0])};
  }else dt.classList.add("hide");
}
$("openColl").onclick=function(){show("coll");renderColl()};
$("back1").onclick=function(){show("home")};

// ---------- trophies ----------
function renderTrophies(){
  var g=$("trGrid");clear(g);var n=0;
  BADGES.forEach(function(b){
    var got=!!S.badges[b.id];if(got)n++;
    var c=h("div","tr"+(got?"":" locked"));
    c.appendChild(h("div","e",got?b.e:"🔒"));c.appendChild(h("b","",b.n));c.appendChild(h("small","",b.d));
    g.appendChild(c);
  });
  $("trSum").textContent=n+" of "+BADGES.length+" trophies won";
}
$("openTrophy").onclick=function(){show("trophy");renderTrophies()};
$("back2").onclick=function(){show("home")};

// ---------- start-up ----------
fillTerms();
var sel=String(S.sel||"all|all").split("|");
$("selTerm").value=sel[0];if($("selTerm").value!==sel[0])$("selTerm").value="all";
fillLessons();
$("selLesson").value=sel[1];if($("selLesson").value!==sel[1])$("selLesson").value="all";
renderHome();

// make it installable and work offline
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
</script>
